name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: shellcheck
        run: shellcheck build.sh run.sh

  checkov:
    name: Checkov — Dockerfile security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install checkov
        run: pip install checkov --quiet

      - name: Run checkov
        run: checkov -f Dockerfile --quiet

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, checkov]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
